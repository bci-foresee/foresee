<!DOCTYPE html>
<html>
<head>
  <title>SCALO Simulator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</head>
<body>
  <h1>SCALO Simulator</h1>
  <div class="simulate">
      <form id="simulateForm" action="/output" method="POST">
        <label for="pipeline">Select Pipeline:</label>
        <select name="pipeline" id="pipeline">
        </select>
        <!-- <input placeholder="Pipeline" required="" type="text" name="pipeline"/> -->
        <input placeholder="Number of runs" required="" type="number" name="numberRuns"/>
        <div>
          <h3>Visualization Options</h3>
          <div>
            <br>
            <label for="accuracy">Accuracy</label>
            <input type="checkbox" name="accuracy" value="accuracy" id="accuracy">
            <br>

            <label for="latency">Latency</label>
            <input type="checkbox" name="latency" value="latency" id="latency">
            <br>

            <label for="power">Power</label>
            <input type="checkbox" name="power" value="power" id="power">
            <br>

            <label for="custom">Custom</label>
            <input type="checkbox" name="custom" value="custom" id="custom">
            <br>

            <div id="customPath" name="customPath" style="display: none;">
              <label for="customPathInput">Custom Function Path</label>
              <input type="text" id="customPathInput" name="customPathInput">
            </div>
          </div>
        </div>
        <button type="submit">SIMULATE</button>
      </form>
  </div>
  <script>
    populatePipelineOptionsFromCSV("{{ url_for('static', filename='pipelines/pipelines.csv') }}");
  </script>
</body>
</html>

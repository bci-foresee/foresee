<!DOCTYPE html>
<html>
<head>
  <title>SCALO Simulator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pipeline.css') }}">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="{{ url_for('static', filename='js/pipeline_visualization.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pipeline_viewer.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pipeline.js') }}"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <a href="/"><h1>SCALO Simulator</h1></a>

  <h3 id="selectedPipeline">{{selected_pipeline}} Pipeline</h3>

  <div id="pipeline-viewer" style="width: 100%; height: 400px; margin: 20px 0;"></div>

  <div class="buttons">
    <button id="rerun-pipeline">Rerun</button>
    <button id="edit-pipeline">Edit</button>
  </div>

  <h3>Latest Visualizations</h3>

  <div class="latestVisContainer">
    <div class="latestVis">
        <h2>Accuracy</h2>
        <div id="latestAccuracyVis"></div>
    </div>
    <div class="latestVis">
        <h2>Latency</h2>
        <div id="latestLatencyVis"></div>
    </div>
    <div class="latestVis">
        <h2>Power</h2>
        <div id="latestPowerVis"></div>
    </div>
  </div>

  <div class="tooltip"></div>

  <script src="{{ url_for('static', filename='js/pipeline.js') }}"></script>
</body>
</html>

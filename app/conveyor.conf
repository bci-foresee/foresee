include required("/stdlib/electron/electron.conf")

// Import metadata from your package.json file, like your fsname, version and which version of Electron to use.
package-json {
  include required("package.json")
  include required("package-lock.json")
}

// Config file documentation: https://conveyor.hydraulic.dev/configs
app {
  display-name = "Foresee"
  rdns-name = edu.yale.foresee
  site.base-url = "http://localhost:3000"


  // Use the Electron logo as an icon.
  //
  // Conveyor can generate a simple icon for you based on your project display name.
  // To try it out just delete this line. For more info see https://conveyor.hydraulic.dev/latest/configs/#icons
  // icons = icons/icon.svg

  // The Koffi module used for invoking the control API requires a higher macOS system version than the default Conveyor uses.
  mac.info-plist.LSMinimumSystemVersion = 15.0.0
  
  // Include main electron files
  inputs += {
    from = "electron"
    to = "electron"
  }
  
  // Include package.json at root level for main entry point
  inputs += {
    from = "."
    to = "."
    filter = ["package.json", "package-lock.json", "next.config.mjs"]
  }
  
  // Include the next.js build output - this is critical for the static files
  inputs += {
    from = "out"
    to = "out"
  }
  
  // Include the public directory (fallback for assets)
  inputs += {
    from = "public"
    to = "public"
  }
  
  // Include the Python backend - CRITICAL for pipeline analysis
  inputs += {
    from = "../backend"
    to = "backend"
    remap = [
      "*.py",
      "*.txt", 
      "*.log",
      "asa/**/*.py",
      "asa/**/*.v",
      "asa/**/*.c",
      "asa/**/*.txt",
      "asa/**/*.json",
      "asa/**/*.md",
      "asa/**/*.sdc",
      "asa/**/*.tcl",
      "asa/**/*.ys",
      "asa/**/*.vvp",
      "asa/**/*.csv",
      "pipelines/**/*.py",
      "pipelines/**/*.json",
      "pipelines/**/*.md",
      "pipelines/**/*.csv",
      "signals/**/*.py",
      "dev_tests/**/*.py",
      "dev_tests/**/*.json",
      "dev_tests/**/*.mat",
      "dev_tests/**/*.csv",
      "hardware_lib/**/*.lib",
      "**/__pycache__/**",
      "-external/**/build/**",
      "-external/**/*.o",
      "-external/**/*.tmp",
      "-external/**/CMakeFiles/**"
    ]
  }
  
  // Include iverilog and vvp binaries for Verilog simulation (actual binaries, not symlinks)
  mac.inputs += {
    from = "/opt/homebrew/Cellar/icarus-verilog/12.0/bin"
    to = "bin"
    filter = ["iverilog", "vvp", "iverilog-vpi"]
  }
  
  // Include iverilog libraries and support files
  mac.inputs += {
    from = "/opt/homebrew/Cellar/icarus-verilog/12.0/lib"
    to = "lib"
    filter = ["ivl/**", "*.a"]
  }
  
  // Include yosys binaries for synthesis and power estimation
  mac.inputs += {
    from = "/opt/homebrew/Cellar/yosys/0.48/bin"
    to = "bin"
    filter = ["yosys", "yosys-abc", "yosys-config", "yosys-filterlib", "yosys-smtbmc", "yosys-witness"]
  }
  
  // Include yosys support files and libraries
  mac.inputs += {
    from = "/opt/homebrew/Cellar/yosys/0.48/share"
    to = "share"
    filter = ["yosys/**"]
  }
  
  // Include only the OpenSTA binary for power estimation (exclude all build artifacts)
  inputs += {
    from = "../backend/external/OpenSTA/app/sta"
    to = "backend/external/OpenSTA/app/sta"
  }
  
  // Include node_modules with native modules and required dependencies
  inputs += {
    from = "node_modules"
    to = "node_modules"
    filter = [
      "better-sqlite3/**", 
      "serve-static/**",
      "electron-serve/**", 
      "@hydraulic/**", 
      "**/*.node"
    ]
  }

  // Build the Next.js app and rebuild native modules before packaging
  // Also ensure Python dependencies are available
  windows.build-steps = [
    { type = npm, args = ["run", "build"] }
    { type = npm, args = ["run", "rebuild"] }
    // Note: Windows users should ensure Python packages are installed globally or use a bundled Python
  ]
  mac.build-steps = [
    { type = npm, args = ["run", "build"] }
    { type = npm, args = ["run", "rebuild"] }
    // Try to install Python dependencies in user space
    { type = command, command = ["bash", "-c", "pip3 install --user -r ../backend/requirements.txt || python3 -m pip install --user -r ../backend/requirements.txt || echo 'Warning: Could not install Python dependencies. User must install manually.'"] }
  ]
  linux.build-steps = [
    { type = npm, args = ["run", "build"] }
    { type = npm, args = ["run", "rebuild"] }
    // Try to install Python dependencies in user space
    { type = command, command = ["bash", "-c", "pip3 install --user -r ../backend/requirements.txt || python3 -m pip install --user -r ../backend/requirements.txt || echo 'Warning: Could not install Python dependencies. User must install manually.'"] }
  ]

  mac {
    info-plist {
      NSSupportsAutomaticGraphicsSwitching = true
      NSRequiresAquaSystemAppearance = false
      NSHighResolutionCapable = true
      NSQuitAlwaysKeepsWindows = false

      LSEnvironment {
        MallocNanoZone = "0"
      }
      NSAppTransportSecurity {
        NSAllowsArbitraryLoads = true
      }
      NSBluetoothAlwaysUsageDescription = This app needs access to Bluetooth
      NSBluetoothPeripheralUsageDescription = This app needs access to Bluetooth
      NSCameraUsageDescription = This app needs access to the camera
      NSMainNibFile = MainMenu
      NSPrincipalClass = AtomApplication
    }
  }
}

// For iteration speed. REMOVE FOR RELEASE.
app.compression-level = high

conveyor.compatibility-level = 17
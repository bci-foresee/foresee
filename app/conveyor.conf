include required("/stdlib/electron/electron.conf")

// Import metadata from your package.json file, like your fsname, version and which version of Electron to use.
package-json {
  include required("package.json")
  include required("package-lock.json")
}

// Config file documentation: https://conveyor.hydraulic.dev/latest/configs
app {
  display-name = "Foresee"
  rdns-name = edu.yale.foresee
  site.base-url = "http://localhost:3000"

  // Check for and apply updates synchronously on every app launch instead of in the background.
  // updates = aggressive

  // Use the Electron logo as an icon.
  //
  // Conveyor can generate a simple icon for you based on your project display name.
  // To try it out just delete this line. For more info see https://conveyor.hydraulic.dev/latest/configs/#icons
  // icons = icons/icon.svg

  // The Koffi module used for invoking the control API requires a higher macOS system version than the default Conveyor uses.
  mac.info-plist.LSMinimumSystemVersion = 11.0.0
  
  // Include main electron files
  inputs += {
    from = "electron"
    to = "electron"
  }
  
  // Include package.json at root level for main entry point
  inputs += {
    from = "."
    to = "."
    filter = ["package.json", "package-lock.json", "next.config.mjs"]
  }
  
  // Include the next.js build output - this is critical for the static files
  inputs += {
    from = "out"
    to = "out"
  }
  
  // Include the public directory (fallback for assets)
  inputs += {
    from = "public"
    to = "public"
  }
  
  // Include node_modules with native modules and required dependencies
  inputs += {
    from = "node_modules"
    to = "node_modules"
    filter = [
      "better-sqlite3/**", 
      "serve-static/**",
      "electron-serve/**", 
      "@hydraulic/**", 
      "**/*.node"
    ]
  }

  // Build the Next.js app and rebuild native modules before packaging
  // Make sure to export static files and rebuild native modules
  windows.build-steps = [
    { type = npm, args = ["run", "build"] }
    { type = npm, args = ["run", "rebuild"] }
  ]
  mac.build-steps = [
    { type = npm, args = ["run", "build"] }
    { type = npm, args = ["run", "rebuild"] }
  ]
  linux.build-steps = [
    { type = npm, args = ["run", "build"] }
    { type = npm, args = ["run", "rebuild"] }
  ]
}

// For iteration speed. REMOVE FOR RELEASE.
app.compression-level = low

conveyor.compatibility-level = 17
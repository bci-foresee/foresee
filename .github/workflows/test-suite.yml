name: CI

on: [push, pull_request]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up Python 3.10
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install Miniconda
        run: |
          wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p $HOME/miniconda
          source $HOME/miniconda/bin/activate
          conda init bash
          conda config --set always_yes yes --set changeps1 no
          conda update -q conda
          conda info -a  # Useful for debugging any issues with conda

      - name: Create conda environment
        run: |
          source $HOME/miniconda/bin/activate
          conda env create -f environment.yaml

      - name: Save conda environment
        uses: actions/cache@v3
        with:
          path: /home/runner/miniconda/envs/scalo_sim
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yaml') }}

  fft_test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Restore conda environment
        uses: actions/cache@v3
        with:
          path: /home/runner/miniconda/envs/scalo_sim
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yaml') }}
          restore-keys: |
            ${{ runner.os }}-conda-

      - name: Activate Conda Environment
        run: |
          source $HOME/miniconda/bin/activate
          conda activate scalo_sim

      - name: Run Test Suite 1
        run: |
          cd ./asa/fft/
          pytest

  bbf_test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Restore conda environment
        uses: actions/cache@v3
        with:
          path: /home/runner/miniconda/envs/scalo_sim
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yaml') }}
          restore-keys: |
            ${{ runner.os }}-conda-

      - name: Activate Conda Environment
        run: |
          source $HOME/miniconda/bin/activate
          conda activate scalo_sim

      - name: Run Test Suite 2
        run: |
          cd ./asa/bbf/
          pytest
